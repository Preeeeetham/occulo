      - paragraph [ref=e43]: What we do
      - heading "We give space a sense of itself." [level=2] [ref=e44]
    - generic [ref=e45]:
      - generic [ref=e46]:
        - generic [ref=e47]:
          - generic [ref=e48]: "01"
          - heading "Space-based analysis, not headcount" [level=3] [ref=e49]:
            - text: Space-based analysis,
            - text: not headcount
        - paragraph [ref=e51]: Existing systems count people. We measure how a space is occupied — its density, its distribution, its available capacity at any given moment. Counting arrivals tells you who entered. Spatial analysis tells you whether the space can safely absorb more.
      - generic [ref=e52]:
        - generic [ref=e53]:
          - generic [ref=e54]: "02"
          - heading "Signals that arrive before the incident" [level=3] [ref=e55]:
            - text: Signals that arrive
            - text: before the incident
        - paragraph [ref=e57]: Overcrowding is not an event. It is a condition that builds. OCCULO reads that condition continuously — so the people responsible for a space can act on it while there is still time to act.
      - generic [ref=e58]:
        - generic [ref=e59]:
          - generic [ref=e60]: "03"
          - heading "Retrofit into existing environments" [level=3] [ref=e61]:
            - text: Retrofit into
            - text: existing environments
        - paragraph [ref=e63]: OCCULO is designed to be added to an environment, not to replace it. It integrates with what is already operational. No structural changes. No extended deployment windows.
      - generic [ref=e64]:
        - generic [ref=e65]:
          - generic [ref=e66]: "04"
          - heading "No personal data, by design" [level=3] [ref=e67]:
            - text: No personal data,
            - text: by design
        - paragraph [ref=e69]: Spatial analysis does not require identity. OCCULO processes environmental conditions — density, distribution, flow — not individuals. No faces. No tracking. No data that could be personal.
  - generic [ref=e71]:
    - paragraph [ref=e72]: Every major crowd incident has one thing in common.
    - paragraph [ref=e73]: The space was full before anyone in charge knew it was full.
    - paragraph [ref=e74]: That is the problem we exist to solve.
