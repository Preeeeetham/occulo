<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Occulo</title>
  <meta name="description"
    content="Occulo gives public infrastructure real-time spatial intelligence by eliminating overcrowding and maximizing safety without structural changes." />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://www.occulo.co/" />

  <!-- Favicon Configuration for All Browsers & Devices -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
  <link rel="shortcut icon" href="/favicon.ico?v=2" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=2" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/site.webmanifest?v=2" />
  <meta name="theme-color" content="#2c6bde" />

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.occulo.co/" />
  <meta property="og:site_name" content="Occulo" />
  <meta property="og:title" content="Occulo" />
  <meta property="og:description"
    content="Occulo gives public infrastructure real-time spatial intelligence by eliminating overcrowding and maximizing safety without structural changes." />
  <meta property="og:image" content="https://assets.occulo.co/og-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://www.occulo.co/" />
  <meta name="twitter:title" content="Occulo" />
  <meta name="twitter:description"
    content="Occulo gives public infrastructure real-time spatial intelligence by eliminating overcrowding and maximizing safety without structural changes." />
  <meta name="twitter:image" content="https://assets.occulo.co/og-preview.png" />

  <!-- Google Search Structured Data (Schema.org Organization & Logo) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Occulo",
    "url": "https://www.occulo.co",
    "logo": "https://assets.occulo.co/favicon.png",
    "description": "Occulo gives public infrastructure real-time spatial intelligence by eliminating overcrowding and maximizing safety without structural changes.",
    "sameAs": [
      "https://www.linkedin.com/company/occulopvtltd/"
    ]
  }
  </script>

  <style>
    ::selection,
    *::selection {
      background-color: #ffffff !important;
      color: #2c6bde !important;
    }

    ::-moz-selection,
    *::-moz-selection {
      background-color: #ffffff !important;
      color: #2c6bde !important;
    }

    /* Asset Protection against copying & dragging */
    img,
    video,
    svg,
    canvas,
    picture {
      -webkit-user-drag: none !important;
      -khtml-user-drag: none !important;
      -moz-user-drag: none !important;
      -o-user-drag: none !important;
      user-drag: none !important;
      -webkit-touch-callout: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    #root {
      min-height: 100%;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
